name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        continue-on-error: true  # skip if release already exists
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body: |
            ## diplomat-agent-ts ${{ github.ref_name }}

            ```bash
            npm install -D @diplomat-ai/diplomat-agent-ts
            npx diplomat-agent-ts scan ./src
            ```

            See [CHANGELOG.md](https://github.com/Diplomat-ai/diplomat-agent-ts/blob/main/CHANGELOG.md) for full release notes.

            **Verify install:**
            ```bash
            npx diplomat-agent-ts --version
            npx diplomat-agent-ts scan ./src
            ```

      - name: Publish to npm
        continue-on-error: true  # skip if version already published
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install hatchling
        run: pip install hatchling --quiet

      - name: Build Python wheel
        run: |
          cd python
          python -m hatchling build

      - name: Publish to PyPI
        continue-on-error: true  # skip if version already published
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: python/dist/
          skip-existing: true
