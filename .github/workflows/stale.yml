name: Close stale issues

on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 7 days
            unless there is new activity. If this is still relevant, please comment
            or reference it in a PR.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days
            unless there is new activity.
          days-before-stale: 60
          days-before-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-issue-labels: 'pinned,security,roadmap,good first issue'
          exempt-pr-labels: 'pinned,security'
