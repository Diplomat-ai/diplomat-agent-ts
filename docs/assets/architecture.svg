<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="arch-title arch-desc" font-family="ui-sans-serif, system-ui, 'Inter', sans-serif">
  <title id="arch-title">diplomat-agent-ts internal architecture</title>
  <desc id="arch-desc">Three vertical lanes — scanner, analyzer, reporter — showing the eight source modules of diplomat-agent-ts and the data flow between them.</desc>

  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6E7681"/>
    </marker>
  </defs>

  <text x="1160" y="40" text-anchor="end" font-size="14" fill="#8B949E" font-family="ui-monospace, monospace">src/</text>

  <rect x="40" y="70" width="340" height="500" rx="14" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="430" y="70" width="340" height="500" rx="14" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="820" y="70" width="340" height="500" rx="14" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="210" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#534AB7" letter-spacing="3">SCANNER</text>
  <text x="600" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#0F6E56" letter-spacing="3">ANALYZER</text>
  <text x="990" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#993C1D" letter-spacing="3">REPORTER</text>

  <rect x="80" y="140" width="260" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="210" y="174" text-anchor="middle" font-size="17" font-weight="600" fill="#26215C" font-family="ui-monospace, monospace">patterns.ts</text>
  <text x="210" y="216" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">side-effect &amp; guard catalog</text>

  <rect x="80" y="260" width="260" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="210" y="294" text-anchor="middle" font-size="17" font-weight="600" fill="#26215C" font-family="ui-monospace, monospace">matcher.ts</text>
  <text x="210" y="336" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">pure matching engine</text>

  <rect x="80" y="380" width="260" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="210" y="414" text-anchor="middle" font-size="17" font-weight="600" fill="#26215C" font-family="ui-monospace, monospace">ast-scanner.ts</text>
  <text x="210" y="456" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">ts-morph AST walker</text>

  <rect x="470" y="200" width="260" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="600" y="234" text-anchor="middle" font-size="17" font-weight="600" fill="#04342C" font-family="ui-monospace, monospace">checks.ts</text>
  <text x="600" y="276" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">computes missingHints</text>

  <rect x="470" y="320" width="260" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="600" y="354" text-anchor="middle" font-size="17" font-weight="600" fill="#04342C" font-family="ui-monospace, monospace">owasp.ts</text>
  <text x="600" y="396" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">OWASP Agentic mapping</text>

  <rect x="860" y="140" width="260" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="990" y="174" text-anchor="middle" font-size="17" font-weight="600" fill="#4A1B0C" font-family="ui-monospace, monospace">registry.ts</text>
  <text x="990" y="216" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">toolcalls.yaml output</text>

  <rect x="860" y="260" width="260" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="990" y="294" text-anchor="middle" font-size="17" font-weight="600" fill="#4A1B0C" font-family="ui-monospace, monospace">json.ts</text>
  <text x="990" y="336" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">snake_case JSON (Python interop)</text>

  <rect x="860" y="380" width="260" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="990" y="414" text-anchor="middle" font-size="17" font-weight="600" fill="#4A1B0C" font-family="ui-monospace, monospace">terminal.ts</text>
  <text x="990" y="456" text-anchor="middle" font-size="12" fill="#5F5E5A" font-style="italic">ANSI stdout report</text>

  <path d="M340 408 Q400 408 410 228 L468 228" stroke="#6E7681" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="368" y="306" width="60" height="22" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="398" y="321" text-anchor="middle" font-size="11" fill="#444441" font-family="ui-monospace, monospace">Tool[]</text>

  <path d="M730 348 Q790 348 800 168 L858 168" stroke="#6E7681" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
  <rect x="752" y="246" width="84" height="22" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="794" y="261" text-anchor="middle" font-size="11" fill="#444441" font-family="ui-monospace, monospace">ScanResult</text>

  <line x1="40" y1="595" x2="1160" y2="595" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="40" y="624" font-size="13" font-weight="600" fill="#444441">Contribution hints</text>

  <circle cx="50" cy="655" r="5" fill="#534AB7"/>
  <text x="64" y="660" font-size="13" fill="#444441">Add a side-effect or guard pattern →</text>
  <text x="338" y="660" font-size="13" fill="#444441" font-family="ui-monospace, monospace">patterns.ts</text>
  <text x="428" y="660" font-size="13" fill="#444441">only</text>

  <circle cx="50" cy="682" r="5" fill="#0F6E56"/>
  <text x="64" y="687" font-size="13" fill="#444441">Change matching logic →</text>
  <text x="248" y="687" font-size="13" fill="#444441" font-family="ui-monospace, monospace">matcher.ts</text>
  <text x="328" y="687" font-size="13" fill="#444441">+ tests</text>

  <circle cx="640" cy="655" r="5" fill="#993C1D"/>
  <text x="654" y="660" font-size="13" fill="#444441">New output format → new file in</text>
  <text x="888" y="660" font-size="13" fill="#444441" font-family="ui-monospace, monospace">reporter/</text>
  <text x="952" y="660" font-size="13" fill="#444441">+</text>
  <text x="964" y="660" font-size="13" fill="#444441" font-family="ui-monospace, monospace">index.ts</text>

  <circle cx="640" cy="682" r="5" fill="#5F5E5A"/>
  <text x="654" y="687" font-size="13" fill="#444441">Bug or regression → fixture in</text>
  <text x="846" y="687" font-size="13" fill="#444441" font-family="ui-monospace, monospace">tests/fixtures/</text>
  <text x="950" y="687" font-size="13" fill="#444441">+ unit test</text>
</svg>