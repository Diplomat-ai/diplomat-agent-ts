<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="ba-title ba-desc" font-family="ui-sans-serif, system-ui, 'Inter', sans-serif">
  <title id="ba-title">Before and after diplomat-agent-ts scan</title>
  <desc id="ba-desc">Two side-by-side panels. Left: unknown tool calls in an AI agent codebase. Right: catalog of governed and unguarded tool calls produced by the scanner.</desc>

  <g>
    <rect x="40" y="40" width="540" height="460" rx="12" fill="#FBEAEA" stroke="#F09595" stroke-width="1"/>

    <text x="60" y="78" font-size="13" font-weight="700" fill="#A32D2D" letter-spacing="1.5">BEFORE</text>
    <text x="60" y="106" font-size="22" font-weight="600" fill="#501313">You can't see what your agent can do.</text>

    <rect x="60" y="140" width="200" height="68" rx="10" fill="#FFFFFF" stroke="#D14444" stroke-width="1.5"/>
    <text x="160" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#161B22">AI agent</text>
    <text x="160" y="190" text-anchor="middle" font-size="12" fill="#5F5E5A">LLM + tool calls</text>

    <path d="M260 174 L320 174" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
    <path d="M260 174 Q300 220 320 245" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
    <path d="M260 174 Q300 268 320 316" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
    <path d="M260 174 Q300 320 320 387" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

    <rect x="320" y="158" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#D14444" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="334" y="179" font-size="12" fill="#5F5E5A" font-family="ui-monospace, monospace">stripe.charges.create</text>
    <text x="508" y="179" text-anchor="end" font-size="14" font-weight="700" fill="#A32D2D">?</text>

    <rect x="320" y="228" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#D14444" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="334" y="249" font-size="12" fill="#5F5E5A" font-family="ui-monospace, monospace">db.users.delete</text>
    <text x="508" y="249" text-anchor="end" font-size="14" font-weight="700" fill="#A32D2D">?</text>

    <rect x="320" y="298" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#D14444" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="334" y="319" font-size="12" fill="#5F5E5A" font-family="ui-monospace, monospace">resend.emails.send</text>
    <text x="508" y="319" text-anchor="end" font-size="14" font-weight="700" fill="#A32D2D">?</text>

    <rect x="320" y="368" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#D14444" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="334" y="389" font-size="12" fill="#5F5E5A" font-family="ui-monospace, monospace">execSync(cmd)</text>
    <text x="508" y="389" text-anchor="end" font-size="14" font-weight="700" fill="#A32D2D">?</text>

    <text x="60" y="446" font-size="13" fill="#5F5E5A">Which side effects? Which checks?</text>
    <text x="60" y="466" font-size="13" font-weight="600" fill="#A32D2D">No idea.</text>
  </g>

  <g>
    <rect x="620" y="40" width="540" height="460" rx="12" fill="#E5F4ED" stroke="#5DCAA5" stroke-width="1"/>

    <text x="640" y="78" font-size="13" font-weight="700" fill="#0F6E56" letter-spacing="1.5">AFTER</text>
    <text x="640" y="106" font-size="22" font-weight="600" fill="#04342C">Every tool call mapped and reviewed.</text>

    <rect x="640" y="140" width="200" height="68" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="740" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#161B22">AI agent</text>
    <text x="740" y="190" text-anchor="middle" font-size="12" fill="#5F5E5A">LLM + tool calls</text>

    <path d="M840 174 L900 174" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
    <path d="M840 174 Q880 220 900 245" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
    <path d="M840 174 Q880 268 900 316" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>
    <path d="M840 174 Q880 320 900 387" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

    <rect x="900" y="158" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
    <text x="914" y="179" font-size="11" fill="#5F5E5A" font-family="ui-monospace, monospace">stripe.charges.create</text>
    <rect x="1062" y="166" width="32" height="16" rx="3" fill="#F85149"/>
    <text x="1078" y="178" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">⚠</text>

    <rect x="900" y="228" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
    <text x="914" y="249" font-size="11" fill="#5F5E5A" font-family="ui-monospace, monospace">db.users.delete</text>
    <rect x="1062" y="236" width="32" height="16" rx="3" fill="#F85149"/>
    <text x="1078" y="248" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">⚠</text>

    <rect x="900" y="298" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
    <text x="914" y="319" font-size="11" fill="#5F5E5A" font-family="ui-monospace, monospace">resend.emails.send</text>
    <rect x="1062" y="306" width="32" height="16" rx="3" fill="#3FB950"/>
    <text x="1078" y="318" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">✓</text>

    <rect x="900" y="368" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
    <text x="914" y="389" font-size="11" fill="#5F5E5A" font-family="ui-monospace, monospace">execSync(cmd)</text>
    <rect x="1062" y="376" width="32" height="16" rx="3" fill="#F85149"/>
    <text x="1078" y="388" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">⚠</text>

    <text x="640" y="446" font-size="13" fill="#5F5E5A">Side effects · OWASP codes · guard coverage.</text>
    <text x="640" y="466" font-size="13" font-weight="600" fill="#0F6E56">Diffable in PRs.</text>
  </g>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/>
    </marker>
  </defs>
</svg>