  <text x="434" y="428" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="14" fill="#3FB950">apache-2.0</text>

  <text x="80" y="556" font-family="ui-monospace, 'SF Mono', monospace" font-size="14" fill="#6E7681">$ npm i -D @diplomat-ai/diplomat-agent-ts</text>

