[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diplomat-agent-ts"
version = "0.1.1"
description = "Scan TypeScript AI agent code for unguarded tool calls — pip wrapper for diplomat-agent-ts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["ai", "agent", "security", "static-analysis", "typescript", "owasp", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Diplomat-ai/diplomat-agent-ts"
Repository = "https://github.com/Diplomat-ai/diplomat-agent-ts"
Issues = "https://github.com/Diplomat-ai/diplomat-agent-ts/issues"
Changelog = "https://github.com/Diplomat-ai/diplomat-agent-ts/blob/main/CHANGELOG.md"

[project.scripts]
diplomat-agent-ts = "diplomat_agent_ts._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["diplomat_agent_ts"]
